name: AI Core OS CI
on: [push, pull_request]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Contracts - Drift Only
        run: dart run build_runner build --delete-conflicting-outputs --build-filter="**/drift_conversation_repository.dart"

      - name: Check for uncommitted generated files
        run: |
          if [[ -n $(git status --porcelain -- '**.g.dart') ]]; then
            echo "Generated Drift files are not committed!"
            git diff -- '**.g.dart'
            exit 1
          fi
          if [ ! -f "lib/core/ai/memory/isar_memory_repository.g.dart" ]; then
            echo "Isar generated files missing! Run tool/generate_isar.sh locally"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit Tests - InMemory
        run: flutter test --coverage
