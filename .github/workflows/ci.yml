name: AI Core OS CI
on: [push, pull_request]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.2', channel: 'stable', cache: true}
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Verify no uncommitted generated files in lib/
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "Uncommitted changes in lib/:"
            git diff -- lib
            exit 1
          fi
      - run: flutter analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.29.2', channel: 'stable', cache: true}
      - run: flutter pub get
      - name: Run tests if test/ exists
        run: |
          if [ ! -d "test" ]; then
            echo "test/ not found - skipping (allowed in v1.1 stabilization)"
            exit 0
          fi
          flutter test --coverage
